name: Tests

# Every pull request into main runs the test suite, so a change shows pass /
# fail before anyone merges it. "npm test" (the job's name below) is the
# required check of the "Require tests" ruleset (no bypass, the owner
# included) — rename the job and update that ruleset too, or pull requests
# wait for a check that never comes. No path filters, for the same reason.
# The deploy (deploy-pages.yml) runs the tests again after the merge.
#
# Deliberately `pull_request`, never `pull_request_target`: code from a fork
# runs with a read-only token and no secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: npm test
